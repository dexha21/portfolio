    <!--
      Theme boot script — runs BEFORE React renders so the correct theme is
      applied on the very first paint (no flash of the wrong theme / FOUC).
      Mirrors the logic in src/hooks/useTheme.js.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('dua-theme-preference')
        var theme =
          stored === 'light'
            ? 'light'
            : stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>

    <!--
      SPA redirect restore — the other half of public/404.html.
      GitHub Pages serves 404.html for unknown paths, which rewrites the URL to
      the `?/route` form; this script turns it back into a real path before
      React Router reads it. Used so a hard refresh on e.g. /portfolio/projects/x-cbt
      does not 404.
    -->
    <script>
      ;(function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&')
            })
            .join('?')

          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decoded + location.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
