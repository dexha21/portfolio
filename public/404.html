<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
        GitHub Pages SPA fallback.

        GitHub Pages serves this file for any path it cannot resolve, with a 404
        status. We rewrite the URL into the `?/path` form that index.html knows
        how to restore, then hand control back to the app.

        pathSegmentsToKeep = 1 because the site is served from
        https://dexha21.github.io/portfolio/ (the repo name is one segment).
      */
      ;(function () {
        var pathSegmentsToKeep = 1
        var location = window.location

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
            location.hash,
        )
      })()
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
